<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TuneSports — Reset Password</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; line-height: 1.6; color: #1a1a1a; max-width: 480px; margin: 0 auto; padding: 40px 20px 80px; }
  h1 { font-size: 1.6rem; margin-bottom: 4px; }
  .sub { color: #666; font-size: 0.95rem; margin-bottom: 28px; }
  label { display: block; font-weight: 600; margin-top: 18px; margin-bottom: 6px; }
  input[type="password"] { width: 100%; box-sizing: border-box; padding: 12px 14px; font-size: 1rem; border: 1px solid #ccc; border-radius: 8px; }
  button { margin-top: 24px; width: 100%; padding: 14px; font-size: 1rem; font-weight: 600; color: #fff; background: #0a63c9; border: none; border-radius: 8px; cursor: pointer; }
  button:disabled { background: #9db8d8; cursor: default; }
  .msg { margin-top: 20px; padding: 14px 16px; border-radius: 8px; font-size: 0.95rem; display: none; }
  .msg.error { background: #fdecec; color: #a3252b; display: block; }
  .msg.success { background: #e9f6ec; color: #1c7a35; display: block; }
  .hint { color: #888; font-size: 0.85rem; margin-top: 6px; }
  footer { margin-top: 48px; font-size: 0.85rem; color: #888; }
</style>
</head>
<body>

<h1>Reset your password</h1>
<p class="sub">Enter a new password for your TuneSports account.</p>

<div id="form-area">
  <label for="pw1">New password</label>
  <input type="password" id="pw1" autocomplete="new-password">
  <p class="hint">At least 8 characters.</p>

  <label for="pw2">Confirm new password</label>
  <input type="password" id="pw2" autocomplete="new-password">

  <button id="submitBtn" onclick="submitReset()">Reset password</button>
</div>

<div id="msg" class="msg"></div>

<footer>
  © 2026 United Stunts Inc. &nbsp;·&nbsp; <a href="privacy-policy.html">Privacy Policy</a>
</footer>

<script>
  const API_BASE = "https://tunesports-production.up.railway.app";

  function getToken() {
    const params = new URLSearchParams(window.location.search);
    return params.get("token");
  }

  function showMsg(text, type) {
    const el = document.getElementById("msg");
    el.textContent = text;
    el.className = "msg " + type;
  }

  const token = getToken();
  if (!token) {
    document.getElementById("form-area").style.display = "none";
    showMsg("This reset link is invalid or incomplete. Please request a new one from the app.", "error");
  }

  async function submitReset() {
    const pw1 = document.getElementById("pw1").value;
    const pw2 = document.getElementById("pw2").value;
    const btn = document.getElementById("submitBtn");

    if (pw1.length < 8) { showMsg("Password must be at least 8 characters.", "error"); return; }
    if (pw1 !== pw2) { showMsg("Passwords do not match.", "error"); return; }

    btn.disabled = true;
    btn.textContent = "Resetting…";

    try {
      const resp = await fetch(API_BASE + "/api/auth/reset-password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: token, new_password: pw1 })
      });

      if (resp.ok) {
        document.getElementById("form-area").style.display = "none";
        showMsg("Your password has been reset. You can now sign in to the TuneSports app with your new password.", "success");
      } else {
        let detail = "This reset link may have expired or already been used. Please request a new one from the app.";
        try { const data = await resp.json(); if (data && data.detail) detail = data.detail; } catch (e) {}
        showMsg(detail, "error");
        btn.disabled = false;
        btn.textContent = "Reset password";
      }
    } catch (e) {
      showMsg("Something went wrong. Please check your connection and try again.", "error");
      btn.disabled = false;
      btn.textContent = "Reset password";
    }
  }
</script>

</body>
</html>
